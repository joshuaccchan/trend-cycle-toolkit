# The weekly watchdog. It answers one question - has the data moved on without
# the estimates? - without MATLAB, without an API key, and without touching a
# number that gets published.
#
# Every Monday it fetches the two FRED series the published models consume -
# DPCERD3Q086SBEA, the PCE price index the four trend inflation models read,
# and GDPC1, which the two output-gap models read - works out the newest quarter
# complete in both, compares that against the vintage recorded in
# estimates/current/metadata.json, and opens or updates one issue when the
# estimates have fallen behind. Then it appends a dated row to
# .github/freshness.csv and commits it.
#
# A RELEASE IS TRIGGERED BY THE DATA. tools/run_update.ps1 -IfNewData runs every
# Monday on the release machine, after this job, and releases when BEA's advance
# estimate has put a new quarter on FRED. Data ahead of the estimates at one
# Monday check is therefore ordinary - the trigger runs later the same day - and
# is reported as "data-ready" in the log, the job summary and the CSV, and
# nowhere else. Data still ahead of the same published vintage at the next Monday
# check means the trigger has not released it in a week, and that opens the
# issue. The usual causes are a release the guardrails refused, which leaves a
# marker under build/ on the release machine, and the release machine being off.
#
# FRB/US PTR is not watched. It has no published schedule, and it cannot hold a
# release back: biuc_lrexp ends where PTR ends.
#
# THE WEEKLY COMMIT IS NOT INCIDENTAL. GitHub disables scheduled workflows in a
# repository with no activity for 60 days, and a repository that publishes four
# times a year will see 60 quiet days between releases. The commit is the
# activity. It is made with a fine-grained PAT rather than the default
# GITHUB_TOKEN so that the push is attributed to a real account instead of to
# github-actions[bot]; if FRESHNESS_PAT is not set the job still runs and still
# commits with the default token, and prints a warning saying the auto-disable
# protection is the part you have lost.
#
# ONE WAY THIS GOES QUIET: the PAT expires. GitHub's fine-grained tokens are
# capped at one year by default. When it expires this job starts failing its
# commit step, and 60 days after that GitHub disables the schedule without
# saying so. Two defenses: put the expiry date in RELEASE_CALENDAR.md, and the
# last step of this job FAILS LOUDLY if .github/freshness.csv has not been
# committed for more than 21 days. That check runs after the append and the
# commit, on purpose, so a failure that has already repaired itself still shows.
#
# Nothing here is required for the published estimates. If this workflow is
# deleted the pipeline still runs; a missed release simply goes unnoticed.
#
# HOW THE FETCHES ARE VALIDATED. Never by HTTP status: a FRED CSV must have a
# first line naming the series requested, and anything starting with '<' is an
# error page whatever the status line says.
name: Freshness watchdog

on:
  schedule:
    - cron: '13 5 * * 1'   # Mondays 05:13 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                                    # git log on the CSV needs history
          token: ${{ secrets.FRESHNESS_PAT || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # How long since this job last committed? Measured before the append, so
      # it reflects the previous commit; acted on at the end, so the repair lands first.
      - name: Age of the last watchdog commit
        id: age
        run: |
          f=.github/freshness.csv
          if [ ! -f "$f" ]; then
            echo "::notice::.github/freshness.csv does not exist yet - this run creates it"
            echo "days=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(git log -1 --format=%ct -- "$f" || true)
          if [ -z "$last" ]; then
            echo "::notice::.github/freshness.csv is untracked - this run commits it for the first time"
            echo "days=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          days=$(( ( $(date -u +%s) - last ) / 86400 ))
          echo "last watchdog commit was $days days ago"
          echo "days=$days" >> "$GITHUB_OUTPUT"

      - name: Check the sources against the published vintage
        id: check
        run: |
          python3 - <<'PY'
          # No third-party packages: urllib and csv from the standard library,
          # so this job cannot be broken by a dependency release on a Monday.
          import csv, datetime, json, os, pathlib, sys, urllib.error, urllib.request

          UA = "trend-cycle-toolkit freshness watchdog (https://github.com/joshuaccchan/trend-cycle-toolkit)"

          # The series the six published models consume: the PCE price index for
          # the four trend inflation models, GDPC1 for the two output-gap models.
          # Nothing else is watched, because a series no model reads cannot leave
          # the estimates behind the data. Both come from BEA's GDP release, so
          # they normally complete a quarter on the same day. Unauthenticated -
          # no FRED API key anywhere in this repository.
          FRED = "https://fred.stlouisfed.org/graph/fredgraph.csv?id={sid}"
          FRED_SERIES = ["DPCERD3Q086SBEA", "GDPC1"]

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA})
              with urllib.request.urlopen(req, timeout=90) as r:
                  return r.read()

          def looks_like_html(body):
              head = body[:512].lstrip()[:1].lower()
              return head in (b"<",)

          def parse_fred_csv(body, sid):
              """Return (last_complete_date, note). Validates shape, not status."""
              if looks_like_html(body):
                  return None, "html error page"
              if body[:2] == b"PK":
                  return None, "zip, not csv"
              try:
                  text = body.decode("utf-8-sig")
              except UnicodeDecodeError:
                  return None, "not text"
              rows = list(csv.reader(text.splitlines()))
              if not rows or len(rows[0]) < 2:
                  return None, "no csv header"
              header = [h.strip().upper() for h in rows[0]]
              if sid.upper() not in header:
                  return None, "header does not name %s" % sid
              col = header.index(sid.upper())
              last = None
              for row in rows[1:]:
                  if len(row) <= col:
                      continue
                  value = row[col].strip()
                  # FRED returns the running quarter as a present row with an
                  # EMPTY value, and uses '.' for a missing observation. Both
                  # mean "not complete".
                  if value in ("", "."):
                      continue
                  try:
                      d = datetime.date.fromisoformat(row[0].strip())
                  except ValueError:
                      continue
                  if last is None or d > last:
                      last = d
              if last is None:
                  return None, "no complete observations"
              return last, ""

          def quarter_of(d):
              return (d.year, (d.month - 1) // 3 + 1)

          def qlabel(q):
              return "%dQ%d" % q if q else ""

          def qparse(s):
              try:
                  y, q = s.upper().split("Q")
                  return (int(y), int(q))
              except Exception:
                  return None

          today = datetime.date.today()
          results = {}
          problems = []

          for sid in FRED_SERIES:
              try:
                  body = fetch(FRED.format(sid=sid))
              except (urllib.error.URLError, OSError) as e:
                  results[sid] = (None, "unreachable: %s" % e)
                  problems.append("%s: unreachable (%s)" % (sid, e))
                  continue
              last, note = parse_fred_csv(body, sid)
              results[sid] = (quarter_of(last) if last else None, note)
              if last is None:
                  problems.append("%s: %s" % (sid, note))

          quarters = [q for q, _ in results.values() if q]
          newest = min(quarters) if len(quarters) == len(FRED_SERIES) else None

          # The two series come from the same BEA release. One complete a
          # quarter further than the other means a source has moved off its
          # usual calendar, which is worth a look before a release runs on it.
          if len(quarters) == len(FRED_SERIES) and max(quarters) != min(quarters):
              problems.append("the series disagree on the newest complete quarter: %s" %
                              ", ".join("%s %s" % (sid, qlabel(results[sid][0])) for sid in FRED_SERIES))

          meta_path = pathlib.Path("estimates/current/metadata.json")
          published = None
          if meta_path.exists():
              try:
                  published = qparse(str(json.loads(meta_path.read_text()).get("vintage", "")))
              except Exception as e:
                  problems.append("estimates/current/metadata.json is unreadable (%s)" % e)

          # The previous row says whether the data were already ahead of this
          # same published vintage a week ago. The trigger runs every Monday
          # after this job, so ahead at two consecutive Monday checks means it
          # has not released.
          f = pathlib.Path(".github/freshness.csv")
          previous = None
          if f.exists():
              with f.open(newline="", encoding="utf-8") as fh:
                  rows = list(csv.DictReader(fh))
              if rows:
                  previous = rows[-1]

          ahead = published is not None and newest is not None and newest > published
          was_ahead = (previous is not None
                       and previous.get("status") in ("data-ready", "stale")
                       and qparse(previous.get("published_vintage", "")) == published)

          if published is None:
              status = "bootstrap"
              headline = "no estimates published yet (estimates/current/metadata.json absent or unreadable)"
          elif problems:
              status = "source-problem"
              headline = "a source needs attention"
          elif ahead and was_ahead:
              status = "stale"
              headline = ("data through %s, estimates still through %s a week after the data "
                          "appeared - the Monday trigger has not released it" % (qlabel(newest), qlabel(published)))
          elif ahead:
              status = "data-ready"
              headline = ("data through %s, estimates through %s - the Monday trigger releases it; "
                          "nothing is late" % (qlabel(newest), qlabel(published)))
          else:
              status = "ok"
              headline = "estimates through %s, nothing newer complete" % qlabel(published)

          # The row is written whatever happened above - an unreachable source is
          # itself the observation worth keeping, and the commit is what keeps the
          # schedule alive.
          f.parent.mkdir(parents=True, exist_ok=True)
          header = ["date", "checked_utc", "DPCERD3Q086SBEA", "GDPC1",
                    "newest_complete", "published_vintage", "status", "note"]
          new = not f.exists()
          with f.open("a", newline="", encoding="utf-8") as fh:
              w = csv.writer(fh)
              if new:
                  w.writerow(header)
              w.writerow([
                  today.isoformat(),
                  datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  qlabel(results["DPCERD3Q086SBEA"][0]) or results["DPCERD3Q086SBEA"][1],
                  qlabel(results["GDPC1"][0]) or results["GDPC1"][1],
                  qlabel(newest), qlabel(published), status, "; ".join(problems),
              ])

          lines = ["| source | complete through | note |", "|---|---|---|"]
          for sid in FRED_SERIES:
              q, note = results[sid]
              lines.append("| `%s` | %s | %s |" % (sid, qlabel(q) or "-", note or ""))
          table = "\n".join(lines)

          body = (
              "%s\n\n%s\n\n"
              "- newest quarter complete in both sources: **%s**\n"
              "- `estimates/current/metadata.json` vintage: **%s**\n\n"
              "On the release machine, check `build\\` for a `release_failed_*` marker - "
              "a refused release leaves one and is not retried until it is removed - "
              "then run `tools\\run_update.ps1`. See RELEASE_CALENDAR.md.\n\n"
              "_Posted by the freshness watchdog; it edits this issue rather than opening another._"
              % (headline, table, qlabel(newest) or "unknown", qlabel(published) or "none")
          )

          pathlib.Path(os.environ["RUNNER_TEMP"], "freshness-issue.md").write_text(body, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("status=%s\n" % status)
              out.write("headline=%s\n" % headline)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as sm:
              sm.write("### Freshness: %s\n\n%s\n\n%s\n" % (status, headline, table))

          annotation = {"stale": "::warning::", "source-problem": "::warning::",
                        "data-ready": "::notice::", "bootstrap": "::notice::"}.get(status, "")
          print("%s%s - %s" % (annotation, status, headline))
          for p in problems:
              print("  problem:", p)
          PY

      # One issue, reused. The title is the marker; do not edit it by hand.
      # Only stale and source-problem open or update it. data-ready - the data
      # ahead of the estimates at a first sighting - is silent here, because the
      # trigger runs later the same Monday and normally releases it. It is in the log, the
      # job summary and the CSV instead.
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
          HEADLINE: ${{ steps.check.outputs.headline }}
        run: |
          title="Freshness watchdog: estimates behind the data"
          num=$(gh issue list --state open --limit 50 --json number,title \
                  --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$STATUS" = "stale" ] || [ "$STATUS" = "source-problem" ]; then
            if [ -n "$num" ]; then
              gh issue comment "$num" --body-file "$RUNNER_TEMP/freshness-issue.md"
              echo "updated issue #$num"
            else
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/freshness-issue.md"
            fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body "Cleared: $HEADLINE"
            gh issue close "$num"
            echo "closed issue #$num"
          else
            echo "nothing to report: $HEADLINE"
          fi

      - name: Commit the log row
        env:
          HAVE_PAT: ${{ secrets.FRESHNESS_PAT != '' }}
        run: |
          if [ "$HAVE_PAT" != "true" ]; then
            echo "::warning::FRESHNESS_PAT is not set - committing with the default token. The row is still written, but a push attributed to github-actions[bot] is weaker protection against the 60-day scheduled-workflow auto-disable. See this file's header."
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/freshness.csv
          git diff --cached --quiet || git commit -m "Freshness check $(date -u +%F)"
          # Another push may have landed since checkout: the other weekly workflow or a
          # release. Neither touches this file, so replaying this commit on top of them
          # cannot conflict.
          for attempt in 1 2 3; do
            if git pull --rebase --quiet && git push --quiet; then break; fi
            if [ "$attempt" = 3 ]; then
              echo "::error::the log row could not be pushed after three attempts"
              exit 1
            fi
            sleep $((attempt * 15))
          done
          tail -2 .github/freshness.csv

      # Last, so the commit above has already repaired the clock this measures.
      - name: The watchdog must not itself go quiet
        env:
          DAYS: ${{ steps.age.outputs.days }}
        run: |
          days="$DAYS"
          if [ "$days" -gt 21 ]; then
            echo "::error::the last freshness commit was $days days ago - the schedule has been skipping. The usual cause is an expired FRESHNESS_PAT; the next is GitHub having disabled the schedule for inactivity. Today's run has committed, which restarts the clock, but check the token expiry and the Actions tab before trusting it."
            exit 1
          fi
          echo "last watchdog commit was $days days ago - within tolerance"
