# Runs the unit suite on every push and pull request. The tests cover the functions
# in core/+uc and estimates/ one at a time, and none of them touches the network.
#
# MATLAB is licensed here because the repository is public: matlab-actions licenses
# all products for public projects, with no token. A private fork would need an
# MLM_LICENSE_TOKEN secret. The published estimates do not depend on this job:
# run_release.m produces them on a licensed machine and runs the same suite first.
#
# Not covered here: the draw-for-draw comparison of each model with its published
# package, which is run by hand, and any chain long enough to matter, which only a
# release runs.
name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Statistics is needed by nearly every sampler; Optimization by the psi steps
      # of biuc_lrexp and uc_ma, which run fminsearch and fminunc.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          products: >
            Statistics_and_Machine_Learning_Toolbox
            Optimization_Toolbox

      - name: Run the unit suite
        uses: matlab-actions/run-command@v3
        with:
          command: run('tests/unit/run_unit_tests.m')
